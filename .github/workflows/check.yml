name: Earthquake Checker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  check-earthquake:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Install dependencies
      run: |
        pip install selenium webdriver-manager

    - name: Run earthquake checker
      run: |
        python earthquake_checker.py

    - name: Scrape new threads
      run: |
        python - <<'EOF'
        import json
        import os
        import subprocess

        if not os.path.exists("reported_threads.json"):
            exit(0)

        with open("reported_threads.json", "r", encoding="utf-8") as f:
            all_urls = json.load(f)

        MAX_PAGES = 21

        progress_file = "thread_progress.json"
        if os.path.exists(progress_file):
            with open(progress_file, "r", encoding="utf-8") as f:
                thread_progress = json.load(f)
        else:
            thread_progress = {}

        scraped_in_this_run = []

        for url in all_urls:
            if url in thread_progress:
                next_start = thread_progress[url] + MAX_PAGES
            else:
                next_start = 1

            print(f"Scraping: {url} from page {next_start}")
            result = subprocess.run(
                ["python", "eksisozluk_into_text.py", url, str(next_start)]
            )

            if result.returncode == 0:
                thread_progress[url] = next_start
                scraped_in_this_run.append(url)

        with open(progress_file, "w", encoding="utf-8") as f:
            json.dump(thread_progress, f, ensure_ascii=False, indent=2)

        with open("newly_scraped.json", "w", encoding="utf-8") as f:
            json.dump(scraped_in_this_run, f, ensure_ascii=False, indent=2)
        EOF

    - name: Classify new entries
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python - <<'EOF'
        import json
        import os
        import subprocess
        import glob

        if not os.path.exists("newly_scraped.json"):
            print("No new threads to classify.")
            exit(0)

        with open("newly_scraped.json", "r", encoding="utf-8") as f:
            new_urls = json.load(f)

        if not new_urls:
            print("No new threads to classify.")
            exit(0)

        entries_files = glob.glob("*_entries.txt")
        if not entries_files:
            print("No entries files found.")
            exit(0)

        entries_files.sort(key=os.path.getmtime, reverse=True)
        latest_file = entries_files[0]

        print(f"Classifying: {latest_file}")
        output_dir = latest_file.replace("_entries.txt", "_classified")
        subprocess.run(["python", "earthquake_classifier.py", latest_file, output_dir], check=True)
        EOF

    - name: Commit and push files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add earthquake_alert_*.txt reported_threads.json thread_progress.json newly_scraped.json || true
        git add *_entries.txt 2>/dev/null || true
        git add *_classified/ 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || (git commit -m "🚨 Earthquake alert detected at $(date '+%Y-%m-%d %H:%M:%S')" && git push)